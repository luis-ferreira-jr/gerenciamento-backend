spring.application.name=gerenciamento-backend

# Producao: Postgres (Neon). Preenchidos via variaveis de ambiente/secrets do host (Fly.io, Railway, etc).
# DATABASE_URL no formato: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Dominios permitidos por CORS, separados por virgula (ex: https://meu-app.vercel.app,http://localhost:4200)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
